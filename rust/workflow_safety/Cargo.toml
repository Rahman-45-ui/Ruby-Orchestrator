[package]
name = "workflow_safety"
version = "0.1.0"
edition = "2021"

[lib]
path = "../../Safe.rs"
crate-type = ["cdylib"]

[dependencies]
magnus = "0.4.4"
rb-sys = { version = "0.9", default-features = false, features = ["stable-api-compiled-fallback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
